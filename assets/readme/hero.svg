<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">WojThom — SWIR work-time toolkit</title>
  <desc id="desc">Dark electric-cyan WojThom banner with a clock, checklist and work-statistics symbol for Android and web.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050A"/>
      <stop offset="0.55" stop-color="#06101A"/>
      <stop offset="1" stop-color="#02050A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0088FF"/>
      <stop offset="0.5" stop-color="#62E5FF"/>
      <stop offset="1" stop-color="#0088FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#62E5FF" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#62E5FF" stroke-opacity="0.25"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <path d="M0 253C190 213 255 300 437 265S732 220 900 256S1080 286 1200 239" fill="none" stroke="url(#cyan)" stroke-opacity="0.24" stroke-width="2"/>
  <path d="M795 45H1180" stroke="#62E5FF" stroke-opacity="0.14"/>
  <path d="M1005 70H1180" stroke="#0088FF" stroke-opacity="0.2"/>
  <g transform="translate(64 56)">
    <rect width="176" height="176" rx="38" fill="#07111C" stroke="#62E5FF" stroke-opacity="0.55"/>
    <circle cx="75" cy="72" r="46" fill="#081827" stroke="url(#cyan)" stroke-width="7" filter="url(#glow)"/>
    <path d="M75 72L54 51M75 72L99 54" stroke="#F4FAFF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="75" cy="72" r="7" fill="#62E5FF"/>
    <path d="M103 48H145L158 61V121H103Z" fill="#0B2035" stroke="#62E5FF" stroke-width="4"/>
    <path d="M145 48V62H158" fill="none" stroke="#62E5FF" stroke-width="4"/>
    <path d="M112 76l6 6 11-13M112 98l6 6 11-13" fill="none" stroke="#62E5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M136 78h13M136 100h13" stroke="#0088FF" stroke-width="4" stroke-linecap="round"/>
    <path d="M42 139h16v18H42ZM68 127h16v30H68ZM94 112h16v45H94Z" fill="url(#cyan)"/>
  </g>
  <text x="280" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#62E5FF">SWIR PROJECT</text>
  <text x="280" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" fill="#F4FAFF">WOJTHOM</text>
  <text x="282" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#B8D2E0">Work-time lists, history, statistics and PDF reports.</text>
  <text x="282" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" letter-spacing="1.5" fill="#62E5FF">ANDROID  •  WEB  •  PL / EN / NO</text>
  <g transform="translate(1015 242)">
    <circle r="4" fill="#62E5FF" filter="url(#glow)"/>
    <circle cx="25" r="4" fill="#0088FF"/>
    <circle cx="50" r="4" fill="#62E5FF" opacity="0.5"/>
  </g>
</svg>
